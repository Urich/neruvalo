name: Prototype checks
on:
  push:
    branches: ['prototype/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neruvalo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: neruvalo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --exclude neruvalo-desktop --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude neruvalo-desktop
      - name: PostgreSQL integration
        env:
          NERUVALO_TEST_DATABASE_URL: postgres://neruvalo:test-only-password@localhost:5432/neruvalo_test
        run: cargo test --locked -p neruvalo-client --test end_to_end -- --test-threads=1
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo check --locked -p neruvalo-desktop --features desktop
      - name: Build desktop executable
        run: cargo build --locked -p neruvalo-desktop --features desktop,custom-protocol
      - name: Build server and console client
        run: cargo build --locked -p neruvalo-server -p neruvalo-client
      - name: Windows end-to-end tests
        run: cargo test --locked -p neruvalo-client --test end_to_end -- --test-threads=1
      - name: Check Windows server startup
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP ('neruvalo-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:NERUVALO_DEV_MODE = 'true'
          $env:DATABASE_URL = 'sqlite:' + [Uri]::EscapeDataString((Join-Path $data 'server.sqlite3')) + '?mode=rwc'
          $env:NERUVALO_DEV_OUTBOX = Join-Path $data 'mail'
          $env:NERUVALO_LISTEN = '127.0.0.1:18787'
          $stdout = Join-Path $data 'stdout.log'
          $stderr = Join-Path $data 'stderr.log'
          $server = Start-Process -FilePath (Resolve-Path target/debug/neruvalo-server.exe) -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($server.HasExited) { break }
              try {
                $null = Invoke-RestMethod http://127.0.0.1:18787/health -TimeoutSec 1 -NoProxy
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            Get-Content $stdout,$stderr -ErrorAction SilentlyContinue
            if (-not $ready) { throw 'Windows server failed its health check' }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Prepare portable prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path prototype-package | Out-Null
          Copy-Item target/debug/neruvalo-desktop.exe,target/debug/neruvalo-server.exe,target/debug/neruvalo-cli.exe prototype-package
          Copy-Item installer/start-dev-server.cmd,docs/prototype.ru.md prototype-package
      - uses: actions/upload-artifact@v4
        with:
          name: neruvalo-windows-prototype
          path: prototype-package/
          retention-days: 14
