[package]
name = "neruvalo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
neruvalo-client.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
zeroize.workspace = true
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
arboard = { version = "3", default-features = false, optional = true }
[build-dependencies]
tauri-build = { version = "2", optional = true }
[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:arboard"]
[[bin]]
name = "neruvalo-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
